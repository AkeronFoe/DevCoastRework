spring.application.name=devcoast

server.port=8080

# Timeout de sesion por inactividad: 7 dias (el default de Spring Boot son 30 minutos).
# Antes estaba en -1 (nunca expira): las sesiones abandonadas quedaban abiertas y en memoria para siempre.
server.servlet.session.timeout=7d

spring.mongodb.uri=${MONGODB_URI}

# DEVCOAST_PERFIL=feria activa además el perfil de Spring «feria» (application-feria.properties): base de datos propia y seeder apagado
spring.profiles.active=${DEVCOAST_PERFIL:}
spring.data.mongodb.auto-index-creation=true

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,text/plain,image/svg+xml
server.compression.min-response-size=1024

# Estaticos (CSS/JS/img): URLs con huella del contenido (/JS/app-<hash>.js) y cache larga en el navegador.
# Cuando un archivo cambia, su URL cambia sola, asi que nadie ve una version vieja.
# (devtools los deja sin cache mientras desarrollas.)
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Datos de ejemplo (DataSeeder). Apagado por defecto; para activarlo: SEED_ENABLED=true
# Solo agrega datos nuevos, una vez (deja una marca en la colección seed_meta) y no envía correos.
devcoast.seed.enabled=${SEED_ENABLED:false}
devcoast.seed.talentos=${SEED_TALENTOS:8000}
devcoast.seed.empresas=${SEED_EMPRESAS:2000}
# Borra antes los datos de ejemplo que dejo el seeder anterior (los reconoce por sus huellas; cuentas reales no se tocan)
devcoast.seed.limpiar-antiguos=${SEED_LIMPIAR_ANTIGUOS:false}

# Marca y contacto: dirección pública (para la vista previa al compartir el enlace) y correo de contacto del pie de página.
# Si DEVCOAST_URL_PUBLICA está vacío se deduce de la petición; si DEVCOAST_CONTACTO está vacío no se muestra correo.
devcoast.url-publica=${DEVCOAST_URL_PUBLICA:}
devcoast.contacto=${DEVCOAST_CONTACTO:}

# Modo feria. DEVCOAST_PERFIL=feria activa: datos curados (feria/datos), botones «Probar como talento/empresa», barra de demo y recorrido.
devcoast.perfil=${DEVCOAST_PERFIL:}
devcoast.feria.datos=${DEVCOAST_FERIA_DATOS:feria/datos}
# Con token, el script feria/reiniciar-demo.sh puede reiniciar la demo (POST /interno/demo/reiniciar). Sin token ese endpoint no existe.
devcoast.feria.token=${DEVCOAST_FERIA_TOKEN:}
# true = rehace la historia de las cuentas demo al arrancar aunque ya exista
devcoast.feria.reiniciar=${FERIA_REINICIAR:false}
# true = solo revisa los archivos de feria/datos, imprime el informe y apaga la app (código de salida 1 si hay errores)
devcoast.feria.solo-validar=${FERIA_SOLO_VALIDAR:false}
# true = enciende el simulador de actividad en vivo (nuevas postulaciones, mensajes y avisos para que la demo se vea viva)
devcoast.feria.simulador=${FERIA_SIMULADOR:false}
devcoast.feria.simulador-segundos=${FERIA_SIMULADOR_SEGUNDOS:45}
