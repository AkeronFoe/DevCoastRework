spring.application.name=devcoast

server.port=8080

# Timeout de sesion por inactividad: 7 dias (el default de Spring Boot son 30 minutos).
# Antes estaba en -1 (nunca expira): las sesiones abandonadas quedaban abiertas y en memoria para siempre.
server.servlet.session.timeout=7d

spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,text/plain,image/svg+xml
server.compression.min-response-size=1024

# Estaticos (CSS/JS/img): URLs con huella del contenido (/JS/app-<hash>.js) y cache larga en el navegador.
# Cuando un archivo cambia, su URL cambia sola, asi que nadie ve una version vieja.
# (devtools los deja sin cache mientras desarrollas.)
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Datos de ejemplo (DataSeeder). Apagado por defecto; para activarlo: SEED_ENABLED=true
# Solo agrega datos nuevos, una vez (deja una marca en la colección seed_meta) y no envía correos.
devcoast.seed.enabled=${SEED_ENABLED:false}
devcoast.seed.talentos=${SEED_TALENTOS:8000}
devcoast.seed.empresas=${SEED_EMPRESAS:2000}
# Borra antes los datos de ejemplo que dejo el seeder anterior (los reconoce por sus huellas; cuentas reales no se tocan)
devcoast.seed.limpiar-antiguos=${SEED_LIMPIAR_ANTIGUOS:false}
