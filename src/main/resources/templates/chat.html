<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta}"></th:block>
    <title th:text="'Chat — ' + ${otroNombre} + ' | DevCoast'">Chat | DevCoast</title>
    <th:block th:replace="~{fragments/head :: assets}"></th:block>
    <script th:src="@{/JS/ui-feedback.js}"></script>
    <script th:src="@{/JS/polish.js}" defer></script>
</head>
<body data-theme="light" class="chat-shell">

<div id="chat-meta"
     th:attr="data-sol-id=${solicitud.id},
              data-user-id=${currentUserId},
              data-otro-avatar=${otroAvatarUrl ?: ''},
              data-mi-avatar=${miAvatarUrl ?: ''},
              data-otro-nombre=${otroNombre ?: '?'}">
</div>

<div class="app-shell">

    <th:block th:replace="~{fragments/sidebar :: sidebar('mensajes')}" />

    <main class="main chat-page">

        <div class="chat-header">

            <a th:href="@{/mensajes}" class="chat-back-btn" title="Volver a Mensajes">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
            </a>

            <div class="chat-header-avatar"
                 th:attr="style='background:' + ${empleo.colorIcono ?: '#1d7fd0'}">
                <svg th:if="${empleo.icono == 'code'}" width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                <svg th:if="${empleo.icono == 'layers'}" width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                <svg th:if="${empleo.icono == 'zap'}" width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                <svg th:if="${empleo.icono == 'rocket'}" width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg>
                <svg th:if="${empleo.icono == 'globe'}" width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                <svg th:if="${empleo.icono == 'terminal'}" width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                <svg th:if="${empleo.icono == 'cpu'}" width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
                <svg th:unless="${empleo.icono == 'code' or empleo.icono == 'layers' or empleo.icono == 'zap' or empleo.icono == 'rocket' or empleo.icono == 'globe' or empleo.icono == 'terminal' or empleo.icono == 'cpu'}"
                     width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2Z"/>
                </svg>
            </div>

            <div class="chat-header-info">
                <div class="chat-header-name" th:text="${otroNombre}">Nombre</div>
                <div class="chat-header-job"
                     th:text="${(empleo.titulo ?: 'Empleo') + ' · ' + (empleo.empresaNombre ?: '')}">
                    Empleo · Empresa
                </div>
            </div>

            <div class="chat-header-estado" style="display:flex;align-items:center;gap:8px;">
                <span class="badge-available" id="chat-live-indicator" title="Recibiendo mensajes nuevos automáticamente" style="font-size:.72rem;padding:4px 10px;">
                    <span class="badge-available-dot"></span>En vivo
                </span>
                <span th:if="${solicitud.estado == 'aprobada'}"  class="status-pill status-approved">Aprobada</span>
                <span th:if="${solicitud.estado == 'rechazada'}" class="status-pill status-rejected">Rechazada</span>
                <span th:if="${solicitud.estado == 'revision'}"  class="status-pill status-review">En revisión</span>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">

            <div class="chat-load-more"
                 id="chat-load-more"
                 th:if="${hayMasAntiguos}"
                 th:attr="data-primer-fecha=${primerMensajeFecha}">
                <button class="chat-load-more-btn" id="chat-load-more-btn" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="m18 15-6-6-6 6"/>
                    </svg>
                    Cargar mensajes anteriores
                </button>
            </div>

            <div th:if="${mensajes == null or #lists.isEmpty(mensajes)}"
                 class="chat-empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <p>Sé el primero en escribir.<br>La conversación quedará guardada aquí.</p>
            </div>

            <div th:each="msg : ${mensajes}"
                 class="chat-msg-row"
                 th:classappend="${msg.remitenteId == currentUserId} ? ' own' : ' other'"
                 th:attr="data-msg-date=${msg.fechaEnvio != null ? #dates.format(msg.fechaEnvio,'yyyy-MM-dd') : ''}">

                <div th:if="${msg.remitenteId != currentUserId}"
                     class="chat-msg-avatar"
                     th:attr="style=${otroAvatarUrl != null}
                         ? 'background-image:url(' + ${otroAvatarUrl} + ');background-size:cover;background-position:center;color:transparent;'
                         : ''">
                    <span th:unless="${otroAvatarUrl != null}" th:text="${otroInitial}">?</span>
                </div>

                <div class="chat-msg-wrap">
                    <div class="chat-bubble" th:text="${msg.texto}">Texto</div>
                    <div class="chat-msg-meta">
                        <span th:if="${msg.remitenteId != currentUserId}"
                              class="chat-sender-name"
                              th:text="${msg.remitenteNombre}">Nombre</span>
                        <span class="chat-msg-time"
                              th:if="${msg.fechaEnvio != null}"
                              th:attr="data-fecha-iso=${#dates.format(msg.fechaEnvio,'yyyy-MM-dd''T''HH:mm:ss.SSS')}"
                              th:text="${#dates.format(msg.fechaEnvio,'HH:mm')}">
                        </span>
                        <span th:if="${msg.remitenteId == currentUserId}"
                              class="chat-read-tick"
                              th:classappend="${msg.leido} ? ' is-read' : ''">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2.5"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </span>
                    </div>
                </div>
            </div>

        </div>

        <div class="chat-input-bar">
            <form th:action="@{|/chat/${solicitud.id}|}" method="post"
                  class="chat-input-form" id="chat-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <textarea id="chat-input" name="texto" class="chat-input-field"
                          rows="1" placeholder="Escribe un mensaje…"
                          autocomplete="off" maxlength="1000"></textarea>
                <button type="submit" class="chat-send-btn" title="Enviar (Enter)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m22 2-7 20-4-9-9-4 20-7z"/><path d="M22 2 11 13"/>
                    </svg>
                </button>
            </form>
        </div>

    </main>
</div>

<script>
(function () {

    var meta         = document.getElementById('chat-meta');
    var solicitudId  = meta.getAttribute('data-sol-id');
    var currentUserId= meta.getAttribute('data-user-id');
    var otroAvatarUrl= meta.getAttribute('data-otro-avatar');
    var otroNombre   = meta.getAttribute('data-otro-nombre');

    var msgArea      = document.getElementById('chat-messages');
    var textarea     = document.getElementById('chat-input');
    var form         = document.getElementById('chat-form');
    var loadMoreWrap = document.getElementById('chat-load-more');
    var loadMoreBtn  = document.getElementById('chat-load-more-btn');

    if (msgArea) msgArea.scrollTop = msgArea.scrollHeight;

    var sendBtn = form ? form.querySelector('.chat-send-btn') : null;
    var sending = false;

    function resetTextareaHeight() {
        if (!textarea) return;
        textarea.style.height = 'auto';
    }

    function enviarMensajeActual() {
        if (!textarea || sending) return;
        var texto = textarea.value.trim();
        if (!texto) return;

        sending = true;
        textarea.disabled = true;
        if (sendBtn) sendBtn.disabled = true;

        fetch('/chat/' + solicitudId + '/enviar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'texto=' + encodeURIComponent(texto)
        })
            .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
            .then(function (data) {
                if (!data.ok) throw new Error('respuesta inesperada');
                textarea.value = '';
                resetTextareaHeight();
                appendMensaje(data.mensaje, true);
                lastSeenIso = data.mensaje.fechaIso || lastSeenIso;
            })
            .catch(function () {
                if (window.UIFeedback && window.UIFeedback.toast) {
                    window.UIFeedback.toast('No se pudo enviar el mensaje. Intenta de nuevo.', 'error');
                }
            })
            .finally(function () {
                sending = false;
                textarea.disabled = false;
                if (sendBtn) sendBtn.disabled = false;
                textarea.focus();
            });
    }

    if (textarea && form) {
        textarea.focus();
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            enviarMensajeActual();
        });
        textarea.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensajeActual();
            }
        });
        textarea.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
    }

    function applyTimestamps(root) {
        (root || document).querySelectorAll('.chat-msg-time:not([data-done])').forEach(function (el) {
            var iso = el.getAttribute('data-fecha-iso');
            if (!iso) return;
            el.textContent = new Date(iso).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
            el.setAttribute('data-done', '1');
        });
    }
    applyTimestamps();

    function buildDateSeps() {
        if (!msgArea) return;
        msgArea.querySelectorAll('.chat-date-sep').forEach(function (s) { s.remove(); });
        var rows    = msgArea.querySelectorAll('.chat-msg-row');
        var lastDay = null;
        rows.forEach(function (row) {
            var d = row.getAttribute('data-msg-date');
            if (!d || d === lastDay) return;
            lastDay = d;
            var date      = new Date(d + 'T00:00:00');
            var now       = new Date();
            var today     = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            var yesterday = new Date(today.getTime() - 86400000);
            var msgDay    = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            var label;
            if (msgDay.getTime() === today.getTime()) {
                label = 'Hoy';
            } else if (msgDay.getTime() === yesterday.getTime()) {
                label = 'Ayer';
            } else {
                label = date.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
                label = label.charAt(0).toUpperCase() + label.slice(1);
            }
            var sep = document.createElement('div');
            sep.className   = 'chat-date-sep';
            sep.textContent = label;
            row.parentNode.insertBefore(sep, row);
        });
    }
    buildDateSeps();

    var TICK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

    function esc(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function buildBubble(msg) {
        var isOwn   = msg.remitenteId === currentUserId;
        var dateStr = msg.fechaIso ? msg.fechaIso.substring(0, 10) : '';
        var timeStr = msg.fechaIso
            ? new Date(msg.fechaIso).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })
            : '';

        var avatarHTML = '';
        if (!isOwn) {
            var avStyle = otroAvatarUrl
                ? 'background-image:url(' + esc(otroAvatarUrl) + ');background-size:cover;background-position:center;color:transparent;'
                : '';
            var initial = otroNombre ? otroNombre.charAt(0).toUpperCase() : '?';
            avatarHTML = '<div class="chat-msg-avatar" style="' + avStyle + '">'
                + (otroAvatarUrl ? '' : '<span>' + esc(initial) + '</span>')
                + '</div>';
        }

        var senderHTML = !isOwn
            ? '<span class="chat-sender-name">' + esc(msg.remitenteNombre || '') + '</span>' : '';
        var tickHTML = isOwn
            ? '<span class="chat-read-tick' + (msg.leido ? ' is-read' : '') + '">' + TICK_SVG + '</span>' : '';
        var timeHTML = timeStr
            ? '<span class="chat-msg-time" data-done="1">' + esc(timeStr) + '</span>' : '';

        return '<div class="chat-msg-row ' + (isOwn ? 'own' : 'other') + '" data-msg-date="' + esc(dateStr) + '">'
            + avatarHTML
            + '<div class="chat-msg-wrap">'
            + '<div class="chat-bubble">' + esc(msg.texto || '') + '</div>'
            + '<div class="chat-msg-meta">' + senderHTML + timeHTML + tickHTML + '</div>'
            + '</div>'
            + '</div>';
    }

    function isNearBottom() {
        if (!msgArea) return true;
        return msgArea.scrollHeight - msgArea.scrollTop - msgArea.clientHeight < 120;
    }

    function appendMensaje(msg, forceScroll) {
        if (!msgArea || !msg) return;
        var wasNearBottom = isNearBottom();
        var tmp = document.createElement('div');
        tmp.innerHTML = buildBubble(msg);
        while (tmp.firstChild) msgArea.appendChild(tmp.firstChild);
        buildDateSeps();
        if (forceScroll || wasNearBottom) msgArea.scrollTop = msgArea.scrollHeight;
    }

    if (loadMoreBtn && loadMoreWrap) {
        loadMoreBtn.addEventListener('click', function () {
            var primerFecha = loadMoreWrap.getAttribute('data-primer-fecha');
            if (!primerFecha) return;

            loadMoreBtn.disabled   = true;
            loadMoreBtn.textContent = 'Cargando…';

            fetch('/chat/' + solicitudId + '/mas-mensajes?antes=' + encodeURIComponent(primerFecha))
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.mensajes && data.mensajes.length > 0) {
                        var firstNode = msgArea.querySelector('.chat-load-more + *') || msgArea.querySelector('.chat-msg-row');
                        var frag      = document.createDocumentFragment();

                        data.mensajes.forEach(function (msg) {
                            var tmp = document.createElement('div');
                            tmp.innerHTML = buildBubble(msg);
                            while (tmp.firstChild) frag.appendChild(tmp.firstChild);
                        });

                        if (firstNode) {
                            msgArea.insertBefore(frag, firstNode);
                        } else {
                            msgArea.appendChild(frag);
                        }

                        buildDateSeps();

                        if (data.primerFecha) {
                            loadMoreWrap.setAttribute('data-primer-fecha', data.primerFecha);
                        }
                    }

                    if (!data.hayMas) {
                        loadMoreWrap.style.display = 'none';
                    } else {
                        loadMoreBtn.disabled = false;
                        loadMoreBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg> Cargar mensajes anteriores';
                    }
                })
                .catch(function () {
                    loadMoreBtn.disabled   = false;
                    loadMoreBtn.textContent = 'Error al cargar. Reintentar';
                });
        });
    }

    var lastSeenIso = (function () {
        var last = null;
        (msgArea ? msgArea.querySelectorAll('.chat-msg-time[data-fecha-iso]') : []).forEach(function (el) {
            var iso = el.getAttribute('data-fecha-iso');
            if (iso && (!last || iso > last)) last = iso;
        });
        return last || new Date().toISOString().substring(0, 19);
    })();

    var liveDot   = document.getElementById('chat-live-indicator');
    var pollTimer = null;

    function pollNuevos() {
        if (document.visibilityState !== 'visible') return;
        fetch('/chat/' + solicitudId + '/nuevos?despues=' + encodeURIComponent(lastSeenIso))
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (!data.mensajes || !data.mensajes.length) return;
                data.mensajes.forEach(function (msg) {
                    appendMensaje(msg, msg.remitenteId !== currentUserId);
                    if (msg.fechaIso && msg.fechaIso > lastSeenIso) lastSeenIso = msg.fechaIso;
                });
            })
            .catch(function () { /* si falla no aviso nada, se reintenta solo en el próximo ciclo */ });
    }

    function startPolling() {
        stopPolling();
        pollTimer = setInterval(pollNuevos, 4000);
        if (liveDot) liveDot.style.opacity = '1';
    }
    function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        if (liveDot) liveDot.style.opacity = '.4';
    }

    if (solicitudId) {
        startPolling();
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
                pollNuevos();
                startPolling();
            } else {
                stopPolling();
            }
        });
        window.addEventListener('beforeunload', stopPolling);
    }

})();
</script>

</body>
</html>
