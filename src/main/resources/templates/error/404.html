<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Página no encontrada | DevCoast</title>
    <th:block th:replace="~{fragments/nautico :: fonts}"></th:block>
    <link rel="stylesheet" th:href="@{/CSS/nautico.css}">
    <link rel="stylesheet" th:href="@{/CSS/nautico-temas.css}">
    <link rel="stylesheet" th:href="@{/CSS/nautico-error.css}">
    <script th:src="@{/JS/preferencias.js}"></script>
</head>

<body class="er">
    <main class="er-main" id="contenido">
        <div class="er-card">
            <div class="er-code" aria-hidden="true">404</div>
            <h1 class="er-t" id="error-title">Página no encontrada</h1>
            <p class="er-d" id="error-desc">La página que buscas no existe o fue movida. Verifica la URL o vuelve al inicio.</p>
            <p class="er-path" id="error-path"></p>
            <div class="er-acts">
                <a class="btn-o" th:href="@{/dashboard}">Ir al dashboard</a>
                <a class="btn-d" th:href="@{/empleos}">Ver empleos</a>
            </div>
        </div>
    </main>
    <div class="er-sea" aria-hidden="true">
        <th:block th:replace="~{fragments/nautico :: boat('hullclip-er')}"></th:block>
        <th:block th:replace="~{fragments/nautico :: sea}"></th:block>
    </div>

    <script>
        // una frase al azar para que caer aquí no se sienta tan seco; la primera es la de siempre
        var mensajes404 = [
            { t: 'Página no encontrada', d: 'La página que buscas no existe o fue movida. Verifica la URL o vuelve al inicio.' },
            { t: 'Esto no compila', d: 'Buscamos por todo el proyecto y no encontramos esta página. Ni el debugger la encuentra.' },
            { t: 'Ruta no encontrada', d: 'Este enlace se fue de freelance a otra plataforma y no dejó dirección nueva.' },
            { t: '404: sin match', d: 'Ni nuestro algoritmo de recomendación pudo encontrar esta página.' },
            { t: 'Merge a /dev/null', d: 'Esta ruta se perdió en un merge. Mejor vuelve por donde sí hay señal.' }
        ];
        var pick = mensajes404[Math.floor(Math.random() * mensajes404.length)];
        document.getElementById('error-title').textContent = pick.t;
        document.getElementById('error-desc').textContent = pick.d;
        var pathEl = document.getElementById('error-path');
        if (pathEl && location.pathname) pathEl.textContent = 'Buscabas: ' + location.pathname;
    </script>
</body>

</html>
