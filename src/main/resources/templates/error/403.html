<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Sesión vencida | DevCoast</title>
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}">
    <th:block th:replace="~{fragments/nautico :: fonts}"></th:block>
    <link rel="stylesheet" th:href="@{/CSS/nautico.css}">
    <link rel="stylesheet" th:href="@{/CSS/nautico-temas.css}">
    <link rel="stylesheet" th:href="@{/CSS/nautico-error.css}">
    <script th:src="@{/JS/preferencias.js}"></script>
</head>

<body class="er">
    <main class="er-main" id="contenido">
        <div class="er-card">
            <div class="er-code" aria-hidden="true">403</div>
            <h1 class="er-t" id="error-title">Esta pantalla ya venció</h1>
            <p class="er-d" id="error-desc">La página llevaba abierta mucho tiempo, o la sesión se cerró, y por seguridad no pudimos completar la acción. Vuelve a empezar y listo.</p>
            <div class="er-acts">
                <a class="btn-o" th:href="@{/about-us}">Volver al inicio</a>
                <a class="btn-d" th:href="@{/login}">Ingresar</a>
            </div>
        </div>
    </main>
    <div class="er-sea" aria-hidden="true">
        <th:block th:replace="~{fragments/nautico :: boat('hullclip-er')}"></th:block>
        <th:block th:replace="~{fragments/nautico :: sea}"></th:block>
    </div>
</body>

</html>
