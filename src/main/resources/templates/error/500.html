<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Error del servidor | DevCoast</title>
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}">
    <th:block th:replace="~{fragments/nautico :: fonts}"></th:block>
    <link rel="stylesheet" th:href="@{/CSS/nautico.css}">
    <link rel="stylesheet" th:href="@{/CSS/nautico-temas.css}">
    <link rel="stylesheet" th:href="@{/CSS/nautico-error.css}">
    <script th:src="@{/JS/preferencias.js}"></script>
</head>

<body class="er">
    <main class="er-main" id="contenido">
        <div class="er-card">
            <div class="er-code" aria-hidden="true">500</div>
            <h1 class="er-t">Error interno del servidor</h1>
            <p class="er-d">Algo salió mal en el servidor. Intenta recargar la página o vuelve en unos momentos.</p>
            <div class="er-acts">
                <a class="btn-o" th:href="@{/dashboard}">Ir al dashboard</a>
                <a class="btn-d" href="javascript:location.reload()">Recargar</a>
            </div>
        </div>
    </main>
    <div class="er-sea" aria-hidden="true">
        <th:block th:replace="~{fragments/nautico :: boat('hullclip-er')}"></th:block>
        <th:block th:replace="~{fragments/nautico :: sea}"></th:block>
    </div>
</body>

</html>
