<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta}"></th:block>
    <title th:text="${nombreEmpresa} + ' | DevCoast'">Empresa | DevCoast</title>
    <th:block th:replace="~{fragments/head :: assets}"></th:block>
    <script th:src="@{/JS/ui-feedback.js}"></script>
    <div id="flash-data" th:if="${flashMessage != null}"
        th:attr="data-message=${flashMessage}, data-type=${flashType ?: 'info'}" style="display:none"></div>
    <script th:src="@{/JS/transitions.js}" defer></script>
    <script th:src="@{/JS/prefetch.js}" defer></script>
    <script th:src="@{/JS/polish.js}" defer></script>
</head>
<body data-theme="light">
<div class="app-shell">

    <th:block th:replace="~{fragments/sidebar :: sidebar('empleos')}" />

    <main class="main empresa-page">

        <header class="topbar">
            <div class="topbar-title">
                <h1 th:text="${nombreEmpresa}">Empresa</h1>
                <p th:if="${sectorEmpresa != null}" th:text="${sectorEmpresa}">Sector</p>
            </div>
            <div class="topbar-actions">
                <a th:href="@{/empleos}" class="btn btn-ghost" style="font-size:.84rem;padding:7px 14px;">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>
                    Volver a empleos
                </a>
                <div class="theme-toggle">
                    <span id="theme-icon">
                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/>
                            <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
                            <path d="M2 12h2"/><path d="M20 12h2"/>
                            <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
                        </svg>
                    </span>
                    <span class="theme-dot"></span>
                    <span id="theme-label">Modo claro</span>
                </div>
            </div>
        </header>

        <div class="card empresa-hero">
            <div class="empresa-hero-inner">

                <div class="empresa-avatar-wrap">
                    <div class="empresa-avatar"
                         th:style="${logoUrl != null}
                             ? 'background-image:url(' + ${logoUrl} + ');background-size:cover;background-position:center;color:transparent;'
                             : ''">
                        <span th:unless="${logoUrl != null}"
                              th:text="${inicial}">E</span>
                    </div>
                </div>

                <div class="empresa-hero-info">
                    <h2 class="empresa-hero-nombre" th:text="${nombreEmpresa}">Nombre empresa</h2>

                    <div class="empresa-hero-meta">
                        <span th:if="${sectorEmpresa != null}" class="empresa-meta-chip">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            <span th:text="${sectorEmpresa}">Sector</span>
                        </span>
                        <span th:if="${tamanoEmpresa != null}" class="empresa-meta-chip">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            <span th:text="${tamanoEmpresa}">Tamaño</span>
                        </span>
                        <span th:if="${empleosActivos != null}" class="empresa-meta-chip empresa-meta-chip--accent">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2Z"/></svg>
                            <span th:text="${#lists.size(empleosActivos)} + ' empleo' + (${#lists.size(empleosActivos)} == 1 ? ' activo' : 's activos')">0 activos</span>
                        </span>
                    </div>

                    <p th:if="${descripcionEmpresa != null and !#strings.isEmpty(descripcionEmpresa)}"
                       class="empresa-hero-bio"
                       th:text="${descripcionEmpresa}">Descripción</p>

                    <a th:if="${webEmpresa != null and !#strings.isEmpty(webEmpresa)}"
                       th:href="${webEmpresa}" target="_blank" rel="noopener"
                       class="empresa-hero-web">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        <span th:text="${webEmpresa}">website.com</span>
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    </a>
                </div>
            </div>
        </div>

        <section>
            <h2 class="section-title">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2"/>
                    <path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2Z"/>
                </svg>
                Posiciones abiertas
            </h2>

            <div th:if="${empleosActivos == null or #lists.isEmpty(empleosActivos)}"
                 class="empty-zone" style="margin-top:0;">
                <div class="empty-icon-wrap">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.5">
                        <rect x="2" y="7" width="20" height="14" rx="2"/>
                        <path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2Z"/>
                    </svg>
                </div>
                <h3>Sin empleos activos</h3>
                <p>Esta empresa no tiene posiciones abiertas en este momento.</p>
            </div>

            <div th:unless="${empleosActivos == null or #lists.isEmpty(empleosActivos)}"
                 class="empresa-empleos-list">

                <a th:each="empleo : ${empleosActivos}"
                   th:href="@{|/empleos/${empleo.id}|}"
                   class="empresa-empleo-card">

                    <div class="empresa-empleo-icon"
                         th:attr="style='background:' + ${empleo.colorIcono ?: '#1d7fd0'}">
                        <svg th:if="${empleo.icono == 'code'}" width="14" height="14" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                        <svg th:if="${empleo.icono == 'layers'}" width="14" height="14" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                        <svg th:if="${empleo.icono == 'zap'}" width="14" height="14" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                        <svg th:unless="${empleo.icono == 'code' or empleo.icono == 'layers' or empleo.icono == 'zap'}" width="14" height="14" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2Z"/></svg>
                    </div>

                    <div class="empresa-empleo-info">
                        <div class="empresa-empleo-titulo" th:text="${empleo.titulo}">Título</div>
                        <div class="empresa-empleo-chips">
                            <span class="tag-pill" th:if="${empleo.modalidad  != null}" th:text="${empleo.modalidad}">Remoto</span>
                            <span class="tag-pill" th:if="${empleo.seniority  != null}" th:text="${empleo.seniority}">Mid</span>
                            <span class="tag-pill" th:if="${empleo.contrato   != null}" th:text="${empleo.contrato}">Full-time</span>
                            <span class="tag-pill" th:if="${empleo.categoria  != null}" th:text="${empleo.categoria}">Backend</span>
                        </div>
                    </div>

                    <div th:if="${scores != null and scores[empleo.id] != null and scores[empleo.id] > 0}"
                         class="score-badge"
                         th:classappend="${scores[empleo.id] >= 70} ? ' score-high' : (${scores[empleo.id]} >= 40 ? ' score-mid' : ' score-low')">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m13 2-10 12h9l-1 8 10-12h-9l1-8z"/></svg>
                        <span th:text="${scores[empleo.id]} + '%'">0%</span>
                    </div>

                    <div th:if="${empleo.mostrarSalario and empleo.salarioMin != null}"
                         class="empresa-empleo-salario">
                        <span th:text="${empleo.formattedSalarioMin} + '–' + ${empleo.formattedSalarioMax} + ' ' + (${empleo.moneda ?: ''})">
                            Salario
                        </span>
                    </div>

                    <svg class="empresa-empleo-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="m9 18 6-6-6-6"/>
                    </svg>
                </a>
            </div>
        </section>

    </main>
</div>
</body>
</html>
