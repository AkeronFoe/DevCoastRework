<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/nautico :: meta}"></th:block>
    <title>Cambiar contraseña | DevCoast</title>
    <th:block th:replace="~{fragments/nautico :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/CSS/nautico-formulario.css}">
</head>

<body th:classappend="${session.usuarioActualTipo == 'empresa'} ? 'empresa'"
    th:with="esEmpresa=${session.usuarioActualTipo == 'empresa'}">
    <a class="skip" href="#contenido">Saltar al contenido</a>

    <div class="app">
        <aside th:replace="~{fragments/nautico :: sidebar('ajustes')}"></aside>
        <div th:replace="~{fragments/nautico :: scrim}"></div>

        <div class="main">
            <header
                th:replace="~{fragments/nautico :: topbar(${esEmpresa} ? '/talentos' : '/empleos', ${esEmpresa} ? 'Buscar talentos' : 'Buscar ofertas', ${esEmpresa} ? 'Busca por nombre, cargo o tecnología' : 'Busca por cargo o empresa', null)}">
            </header>

            <main class="content fm estrecho" id="contenido">
                <p class="flash" role="status" th:if="${flashMessage != null}"
                    th:classappend="${flashType == 'error' or flashType == 'warning'} ? 'error'"
                    th:text="${flashMessage}">Aviso</p>

                <div class="head">
                    <div>
                        <div class="eyebrow">// ajustes · cuenta</div>
                        <h1>Cambiar contraseña</h1>
                        <p class="sub">Actualiza la contraseña con la que entras a DevCoast.</p>
                    </div>
                </div>

                <form class="card cp" method="post" th:action="@{/cambiarPassword}" id="form-password"
                    autocomplete="off" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="form-grid">
                        <div class="field-group">
                            <label for="passwordActual" class="field-label">Contraseña actual</label>
                            <input type="password" id="passwordActual" name="passwordActual" class="form-input" required
                                autocomplete="current-password" placeholder="Tu contraseña actual">
                        </div>

                        <div class="field-group">
                            <label for="passwordNueva" class="field-label">Nueva contraseña</label>
                            <input type="password" id="passwordNueva" name="passwordNueva" class="form-input" required
                                minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres"
                                aria-describedby="ayudaNueva">
                            <span class="field-hint" id="ayudaNueva">Usa al menos 8 caracteres.</span>
                        </div>

                        <div class="field-group">
                            <label for="passwordConfirmar" class="field-label">Confirmar nueva contraseña</label>
                            <input type="password" id="passwordConfirmar" name="passwordConfirmar" class="form-input"
                                required minlength="8" autocomplete="new-password"
                                placeholder="Repite la nueva contraseña" aria-describedby="mismatch-msg">
                            <p id="mismatch-msg" class="cp-err" role="alert" hidden>Las contraseñas no coinciden.</p>
                        </div>
                    </div>

                    <div class="step-nav">
                        <a class="btn btn-ghost" th:href="@{/ajustes}">Cancelar</a>
                        <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar cambios</button>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <div th:replace="~{fragments/nautico :: toast}"></div>

    <script>
        (function () {
            var form = document.getElementById('form-password');
            var nueva = document.getElementById('passwordNueva');
            var confirmar = document.getElementById('passwordConfirmar');
            var msg = document.getElementById('mismatch-msg');
            var btn = document.getElementById('btn-guardar');

            function revisar() {
                var mal = confirmar.value.length > 0 && nueva.value !== confirmar.value;
                msg.hidden = !mal;
                confirmar.classList.toggle('error', mal);
                btn.disabled = mal;
            }
            nueva.addEventListener('input', revisar);
            confirmar.addEventListener('input', revisar);

            form.addEventListener('submit', function (e) {
                if (nueva.value !== confirmar.value) { e.preventDefault(); msg.hidden = false; confirmar.focus(); }
            });
        })();
    </script>
</body>

</html>
