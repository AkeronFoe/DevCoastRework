<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: meta}"></th:block>
    <title>DevCoast | Cambiar contraseña</title>
    <th:block th:replace="~{fragments/head :: assets}"></th:block>
    <script th:src="@{/JS/ui-feedback.js}"></script>
    <script th:src="@{/JS/transitions.js}" defer></script>
    <script th:src="@{/JS/prefetch.js}" defer></script>
    <script th:src="@{/JS/polish.js}" defer></script>
</head>

<body data-theme="light">

    <!-- ui-feedback.js busca este div por id y lee sus data-attrs para el toast -->
    <div id="flash-data" th:if="${flashMessage != null}"
         th:attr="data-message=${flashMessage}, data-type=${flashType ?: 'info'}"
         style="display:none"></div>

    <div class="app-shell">
        <th:block th:replace="~{fragments/sidebar :: sidebar('ajustes')}" />

        <main class="main">
            <header class="topbar">
                <div class="topbar-title">
                    <h1>Cambiar contraseña</h1>
                    <p>Actualiza tu contraseña de acceso a DevCoast.</p>
                </div>
                <div class="topbar-actions">
                    <a th:href="@{/ajustes}" class="btn btn-ghost btn-icon">
                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
                        </svg>
                        Volver a ajustes
                    </a>
                </div>
            </header>

            <div class="content" style="max-width:480px;">
                <div class="card" style="padding:2rem;">
                    <h2 style="margin:0 0 1.5rem;font-size:1.05rem;font-weight:600;">
                        Nueva contraseña
                    </h2>

                    <form method="post" th:action="@{/cambiarPassword}" id="form-password"
                          autocomplete="off" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="form-group" style="margin-bottom:1.25rem;">
                            <label for="passwordActual" class="form-label">Contraseña actual</label>
                            <input type="password" id="passwordActual" name="passwordActual"
                                   class="form-input" required autocomplete="current-password"
                                   placeholder="Tu contraseña actual">
                        </div>

                        <div class="form-group" style="margin-bottom:1.25rem;">
                            <label for="passwordNueva" class="form-label">Nueva contraseña</label>
                            <input type="password" id="passwordNueva" name="passwordNueva"
                                   class="form-input" required minlength="6" autocomplete="new-password"
                                   placeholder="Mínimo 6 caracteres">
                        </div>

                        <div class="form-group" style="margin-bottom:2rem;">
                            <label for="passwordConfirmar" class="form-label">Confirmar nueva contraseña</label>
                            <input type="password" id="passwordConfirmar" name="passwordConfirmar"
                                   class="form-input" required minlength="6" autocomplete="new-password"
                                   placeholder="Repite la nueva contraseña">
                            <p id="mismatch-msg"
                               style="color:var(--danger,#ef4444);font-size:.8rem;margin-top:.4rem;display:none;">
                                Las contraseñas no coinciden.
                            </p>
                        </div>

                        <div style="display:flex;gap:.75rem;justify-content:flex-end;">
                            <a th:href="@{/ajustes}" class="btn btn-ghost">Cancelar</a>
                            <button type="submit" class="btn btn-primary" id="btn-guardar">
                                Guardar cambios
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        const form      = document.getElementById('form-password')
        const nueva     = document.getElementById('passwordNueva')
        const confirmar = document.getElementById('passwordConfirmar')
        const msg       = document.getElementById('mismatch-msg')
        const btn       = document.getElementById('btn-guardar')

        function checkMatch() {
            const bad = confirmar.value.length > 0 && nueva.value !== confirmar.value
            msg.style.display = bad ? 'block' : 'none'
            btn.disabled = bad
        }

        nueva.addEventListener('input', checkMatch)
        confirmar.addEventListener('input', checkMatch)

        form.addEventListener('submit', function (e) {
            if (nueva.value !== confirmar.value) {
                e.preventDefault()
                msg.style.display = 'block'
            }
        })
    </script>

</body>
</html>
