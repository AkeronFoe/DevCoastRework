<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:fragment="meta">
        <meta charset="UTF-8">
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
        <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png}">
        <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}">
    </th:block>

    <th:block th:fragment="assets">
        <link rel="stylesheet" th:href="@{/CSS/styles.css}">
        <script th:src="@{/JS/themes.js}"></script>
        <script th:src="@{/JS/i18n.js}"></script>
    </th:block>
</head>

</html>
