<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- pedazo de <head> que se repetía en TODAS las paginas, ahora vive aca solo -->
    <th:block th:fragment="meta">
        <meta charset="UTF-8">
        <!-- esto es pal token del CSRF, si lo quitan de una pagina los POST/fetch de esa pagina van a tirar 403 -->
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </th:block>

    <th:block th:fragment="assets">
        <link rel="stylesheet" th:href="@{/CSS/styles.css}">
        <script th:src="@{/JS/themes.js}"></script>
        <script th:src="@{/JS/i18n.js}"></script>
    </th:block>
</head>

</html>
