<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<body>

    <th:block th:fragment="sidebar(activePage)">

        <button class="sidebar-toggle-btn" id="sidebar-toggle" aria-label="Abrir menú" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
        </button>

        <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

        <!-- esto se renderiza oculto y el JS lo reubica en .topbar-actions de cada página -->
        <div id="bell-widget-host" style="display:none; position:relative; align-items:center;">
            <button class="bell-btn" id="bell-btn" type="button" aria-label="Notificaciones" title="Notificaciones">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
                <span class="bell-btn-badge" th:if="${notifNoLeidas != null and notifNoLeidas > 0}"
                    th:text="${notifNoLeidas}">1</span>
            </button>

            <div class="bell-dropdown" id="bell-dropdown" style="display:none">
                <div class="bell-dropdown-header">
                    <span class="bell-dropdown-title">Notificaciones</span>
                    <span class="bell-dropdown-count" th:if="${notifNoLeidas != null and notifNoLeidas > 0}"
                        th:text="${notifNoLeidas} + ' nueva' + (${notifNoLeidas} == 1 ? '' : 's')">
                    </span>
                </div>

                <div class="bell-dropdown-items">
                    <div th:if="${notifRecientes == null or #lists.isEmpty(notifRecientes)}" class="bell-empty">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                        </svg>
                        <span>Sin notificaciones nuevas</span>
                    </div>

                    <div th:each="n : ${notifRecientes}" class="notif-item"
                        th:classappend="${!n.leida} ? ' notif-item--unread' : ''">
                        <a th:href="@{|/notificaciones/${n.id}/ir|}" class="notif-item-link">
                            <div class="notif-item-dot" th:if="${!n.leida}"></div>
                            <div class="notif-item-icon" th:classappend="${n.tipo == 'NUEVA_SOLICITUD'} ? ' notif-icon--blue'
                                          : (${n.tipo == 'ESTADO_SOLICITUD'} ? ' notif-icon--green'
                                          : (${n.tipo == 'NUEVO_MENSAJE'} ? ' notif-icon--blue'
                                          : ' notif-icon--purple'))">
                                <svg th:if="${n.tipo == 'NUEVA_SOLICITUD'}" width="12" height="12" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2.2">
                                    <path
                                        d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
                                    <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
                                </svg>
                                <svg th:if="${n.tipo == 'ESTADO_SOLICITUD'}" width="12" height="12" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2.2">
                                    <polyline points="20 6 9 17 4 12" />
                                </svg>
                                <svg th:if="${n.tipo == 'NUEVA_INVITACION'}" width="12" height="12" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2.2">
                                    <path
                                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.3 1.77.54 2.61a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.47-1.11a2 2 0 0 1 2.11-.45c.84.24 1.71.42 2.61.54A2 2 0 0 1 22 16.92z" />
                                </svg>
                                <svg th:if="${n.tipo == 'NUEVO_MENSAJE'}" width="12" height="12" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2.2">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                                </svg>
                            </div>
                            <div class="notif-item-body">
                                <div class="notif-item-title" th:text="${n.titulo}">Título</div>
                                <div class="notif-item-msg" th:text="${n.mensaje}">Mensaje</div>
                            </div>
                        </a>
                    </div>
                </div>

                <div th:if="${notifNoLeidas != null and notifNoLeidas > 0}" class="bell-dropdown-footer">
                    <button class="notif-mark-all-btn" type="button" onclick="marcarTodasLeidas(this)">
                        Marcar todas como leídas
                    </button>
                </div>
            </div>
        </div>

        <aside class="sidebar" id="main-sidebar">

            <div class="brand">
                <div class="brand-mark">
                    <img th:src="@{/img/DevCoast iconx256.png}" alt="DevCoast">
                </div>
                <div class="brand-text">
                    <div class="brand-name">DevCoast</div>
                    <div class="brand-tag"
                        th:text="${usuarioActualTipo == 'empresa' ? 'Portal empresa' : 'Talento creativo'}">
                        Talento creativo
                    </div>
                </div>
                <button class="sidebar-rail-toggle" id="sidebar-rail-toggle" type="button"
                    aria-label="Colapsar navegación" title="Colapsar navegación">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                </button>
            </div>

            <nav class="nav">

                <span class="nav-section">General</span>

                <a class="nav-link" th:href="@{/dashboard}" data-label="Dashboard"
                    th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <rect x="3" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="14" width="7" height="7" rx="1" />
                        <rect x="3" y="14" width="7" height="7" rx="1" />
                    </svg>
                    <span class="nav-label">Dashboard</span>
                </a>

                <a class="nav-link" th:href="@{/analytics}" data-label="Analytics"
                    th:classappend="${activePage == 'analytics'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M12 16v5" />
                        <path d="M16 14.639V21" />
                        <path d="M20 10.656V21" />
                        <path d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15" />
                        <path d="M4 18.463V21" />
                        <path d="M8 14.656V21" />
                    </svg>
                    <span class="nav-label">Analytics</span>
                </a>

                <a class="nav-link" th:href="@{/empleos}" data-label="Empleos"
                    th:classappend="${activePage == 'empleos'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                        <path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2Z" />
                    </svg>
                    <span class="nav-label">Empleos</span>
                </a>

                <a class="nav-link" th:href="@{/talentos}" data-label="Talentos"
                    th:classappend="${activePage == 'talentos'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                    <span class="nav-label">Talentos</span>
                </a>

                <span class="nav-section">Mi cuenta</span>

                <a class="nav-link" th:href="@{/mensajes}" data-label="Mensajes"
                    th:classappend="${activePage == 'mensajes'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    <span class="nav-label">Mensajes</span>
                    <span class="nav-badge" th:if="${mensajesNoLeidos != null and mensajesNoLeidos > 0}"
                        th:text="${mensajesNoLeidos}">1</span>
                </a>

                <a class="nav-link" th:if="${usuarioActualTipo != 'empresa'}" th:href="@{/solicitudes}"
                    data-label="Solicitudes" th:classappend="${activePage == 'solicitudes'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path
                            d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
                        <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
                    </svg>
                    <span class="nav-label">Solicitudes</span>
                    <span th:if="${invPendienteCount != null and invPendienteCount > 0}" class="nav-badge"
                        th:text="${invPendienteCount}">1</span>
                </a>

                <a class="nav-link" th:if="${usuarioActualTipo != 'empresa'}" th:href="@{/empleos/guardados}"
                    data-label="Guardados" th:classappend="${activePage == 'guardados'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span class="nav-label">Guardados</span>
                </a>

                <a class="nav-link" th:if="${usuarioActualTipo != 'empresa'}" th:href="@{/misProyectos}"
                    data-label="Mis proyectos" th:classappend="${activePage == 'misProyectos'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z" />
                    </svg>
                    <span class="nav-label">Mis proyectos</span>
                </a>

                <a class="nav-link" th:if="${usuarioActualTipo == 'empresa'}" th:href="@{/misEmpleos}"
                    data-label="Mis empleos" th:classappend="${activePage == 'misEmpleos'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                        <path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2Z" />
                        <line x1="12" y1="12" x2="12" y2="17" />
                        <line x1="9.5" y1="14.5" x2="14.5" y2="14.5" />
                    </svg>
                    <span class="nav-label">Mis empleos</span>
                    <span th:if="${solicitudesPendientesEmpresa != null and solicitudesPendientesEmpresa > 0}"
                        class="nav-badge" th:text="${solicitudesPendientesEmpresa}">1</span>
                </a>

                <a class="nav-link" th:if="${usuarioActualTipo == 'empresa'}" th:href="@{/candidatos}"
                    data-label="Candidatos" th:classappend="${activePage == 'candidatos'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                    <span class="nav-label">Candidatos</span>
                </a>

                <a class="nav-link" th:if="${usuarioActualTipo == 'empresa'}" th:href="@{/crearEmpleo}"
                    data-label="Publicar empleo" th:classappend="${activePage == 'crearEmpleo'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    <span class="nav-label">Publicar empleo</span>
                </a>

                <a class="nav-link" th:href="@{/perfil}" data-label="Perfil"
                    th:classappend="${activePage == 'perfil'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <span class="nav-label">Perfil</span>
                </a>

                <a class="nav-link" th:if="${usuarioActualTipo != 'empresa'}" th:href="@{/curriculum}"
                    data-label="Curriculum" th:classappend="${activePage == 'curriculum'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" x2="8" y1="13" y2="13" />
                        <line x1="16" x2="8" y1="17" y2="17" />
                        <line x1="10" x2="8" y1="9" y2="9" />
                    </svg>
                    <span class="nav-label">Curriculum</span>
                </a>

                <span class="nav-section">Sistema</span>

                <a class="nav-link" th:href="@{/ajustes}" data-label="Ajustes"
                    th:classappend="${activePage == 'ajustes'} ? ' active' : ''">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
                    </svg>
                    <span class="nav-label">Ajustes</span>
                </a>

                <button class="nav-link" id="btn-nav-logout" type="button" data-label="Cerrar sesión"
                    style="color:var(--muted);width:100%;text-align:left;">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    <span class="nav-label">Cerrar sesión</span>
                </button>

            </nav>

            <div class="sidebar-panel">
                <a class="profile-link" th:href="@{/perfil}" data-label="Perfil">
                    <div class="profile-avatar" th:style="${usuarioActualFotoUrl != null}
                        ? 'background-image: url(' + ${usuarioActualFotoUrl} + '); background-size: cover; background-position: center; color: transparent;'
                        : ''">
                        <span th:if="${usuarioActualFotoUrl == null}" th:text="${usuarioActualNombre != null and !#strings.isEmpty(usuarioActualNombre)
                            ? usuarioActualNombre.substring(0,1).toUpperCase() : 'D'}">D</span>
                    </div>
                    <div class="profile-text">
                        <div class="profile-name" th:text="${usuarioActualNombre != null and !#strings.isEmpty(usuarioActualNombre)
                            ? usuarioActualNombre : 'Usuario'}">Usuario</div>
                        <div class="profile-role" th:text="${usuarioActualCorreo != null ? usuarioActualCorreo : ''}">
                        </div>
                    </div>
                </a>
                <div class="profile-progress-wrap profile-text" th:if="${usuario != null and usuarioActualTipo != 'empresa'}">
                    <div class="profile-progress-label">
                        <span>Perfil completo</span>
                        <span th:text="${usuario.completitudPerfil + '%'}">0%</span>
                    </div>
                    <div class="profile-progress-track">
                        <div class="profile-progress-fill" th:style="'width:' + ${usuario.completitudPerfil} + '%'">
                        </div>
                    </div>
                </div>
            </div>

        </aside>

        <style>
            .nav-badge {
                margin-left: auto;
                background: var(--accent);
                color: #000;
                font-size: 10px;
                font-weight: 700;
                padding: 1px 6px;
                border-radius: 999px;
                min-width: 18px;
                text-align: center;
                line-height: 1.6;
            }

            /* ── Bell button (inyectado en topbar) ──────────── */
            .bell-btn {
                position: relative;
                width: 34px;
                height: 34px;
                border-radius: 10px;
                background: var(--surface-2, rgba(0, 0, 0, .04));
                border: 1px solid var(--border);
                color: var(--text);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: background .15s, border-color .15s, color .15s;
                flex-shrink: 0;
            }

            .bell-btn:hover,
            .bell-btn.is-open {
                background: rgba(29, 127, 208, .1);
                border-color: var(--accent);
                color: var(--accent);
            }

            .bell-btn-badge {
                position: absolute;
                top: -5px;
                right: -5px;
                background: var(--accent);
                color: #fff;
                font-size: 0.6rem;
                font-weight: 700;
                min-width: 16px;
                height: 16px;
                border-radius: 999px;
                display: flex;
                align-items: center;
                justify-content: center;
                line-height: 1;
                padding: 0 3px;
                border: 1.5px solid var(--surface);
            }

            /* ── Bell dropdown ──────────────────────────────── */
            .bell-dropdown {
                position: absolute;
                top: calc(100% + 10px);
                right: 0;
                width: 320px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-md, 18px);
                box-shadow: 0 8px 32px rgba(15, 23, 42, .16);
                z-index: 500;
                overflow: hidden;
            }

            .bell-dropdown-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 16px 10px;
                border-bottom: 1px solid var(--border);
            }

            .bell-dropdown-title {
                font-size: 0.86rem;
                font-weight: 700;
                color: var(--text);
            }

            .bell-dropdown-count {
                font-size: 0.75rem;
                color: var(--accent);
                font-weight: 600;
            }

            .bell-dropdown-items {
                max-height: 340px;
                overflow-y: auto;
            }

            .bell-dropdown-items::-webkit-scrollbar {
                width: 3px;
            }

            .bell-dropdown-items::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 3px;
            }

            .bell-empty {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                padding: 28px 16px;
                color: var(--muted);
                font-size: 0.82rem;
                opacity: .7;
            }

            .bell-dropdown-footer {
                padding: 8px 16px;
                border-top: 1px solid var(--border);
                text-align: center;
            }

            /* ── Notif items (reutilizados en dropdown) ─────── */
            .notif-item {
                position: relative;
                border-bottom: 1px solid var(--border);
            }

            .notif-item:last-child {
                border-bottom: none;
            }

            .notif-item--unread {
                background: rgba(29, 127, 208, .04);
            }

            .notif-item-link {
                display: flex;
                gap: 9px;
                align-items: flex-start;
                padding: 10px 14px;
                text-decoration: none;
                transition: background .12s;
            }

            .notif-item-link:hover {
                background: var(--surface-2, rgba(0, 0, 0, .03));
            }

            .notif-item-dot {
                position: absolute;
                top: 12px;
                right: 10px;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--accent);
            }

            .notif-item-icon {
                width: 26px;
                height: 26px;
                border-radius: 7px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                margin-top: 1px;
            }

            .notif-icon--blue {
                background: rgba(29, 127, 208, .12);
                color: var(--accent);
            }

            .notif-icon--green {
                background: rgba(22, 163, 74, .1);
                color: #16a34a;
            }

            .notif-icon--purple {
                background: rgba(109, 40, 217, .1);
                color: #7c3aed;
            }

            .notif-item-body {
                flex: 1;
                min-width: 0;
            }

            .notif-item-title {
                font-size: 11.5px;
                font-weight: 600;
                color: var(--text);
                line-height: 1.35;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .notif-item-msg {
                font-size: 10.5px;
                color: var(--muted);
                margin-top: 2px;
                line-height: 1.4;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .notif-mark-all-btn {
                background: none;
                border: none;
                color: var(--accent);
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                padding: 0;
            }

            .notif-mark-all-btn:hover {
                text-decoration: underline;
            }

            /* ── Sidebar toggle (móvil) ─────────────────────── */
            .sidebar-toggle-btn {
                display: none;
                position: fixed;
                top: 14px;
                left: 14px;
                z-index: 110;
                width: 38px;
                height: 38px;
                border-radius: 10px;
                border: 1px solid var(--border);
                background: var(--card-bg, #fff);
                color: var(--text);
                cursor: pointer;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
                transition: background .15s;
            }

            .sidebar-toggle-btn:hover {
                background: var(--surface-2);
            }

            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, .45);
                z-index: 99;
                backdrop-filter: blur(2px);
            }

            .sidebar-overlay.is-open {
                display: block;
            }

            /* ── Rail toggle (colapsar sidebar a solo iconos) ──────── */
            .sidebar-rail-toggle {
                margin-left: auto;
                width: 24px;
                height: 24px;
                border-radius: 6px;
                border: none;
                background: transparent;
                color: var(--muted);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                flex-shrink: 0;
                transition: background .15s, color .15s;
            }

            .sidebar-rail-toggle svg {
                width: 15px;
                height: 15px;
            }

            .sidebar-rail-toggle:hover {
                background: var(--surface-2);
                color: var(--accent);
            }

            .sidebar-rail-toggle:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            /* Estado colapsado: activo manualmente o automático por poco espacio.
               Se ignora por debajo de 1101px, donde ya existe el layout de tablet/móvil. */
            @media (min-width: 1101px) {

                html[data-sidebar="rail"] .app-shell {
                    grid-template-columns: 64px minmax(0, 1fr);
                }

                html[data-sidebar="rail"] #main-sidebar {
                    padding-left: 8px;
                    padding-right: 8px;
                }

                html[data-sidebar="rail"] .brand-text,
                html[data-sidebar="rail"] .nav-label,
                html[data-sidebar="rail"] .nav-badge,
                html[data-sidebar="rail"] .profile-text,
                html[data-sidebar="rail"] .nav-section {
                    display: none;
                }

                html[data-sidebar="rail"] .nav-section {
                    display: block;
                    height: 1px;
                    margin: 10px 4px;
                    padding: 0;
                    background: var(--border);
                    opacity: 1;
                    overflow: hidden;
                    font-size: 0;
                    white-space: nowrap;
                }

                html[data-sidebar="rail"] .sidebar .nav-link,
                html[data-sidebar="rail"] .app-shell .nav-link {
                    justify-content: center;
                }

                html[data-sidebar="rail"] .brand {
                    flex-direction: column;
                    justify-content: center;
                    gap: 8px;
                }

                html[data-sidebar="rail"] .sidebar-rail-toggle {
                    margin-left: 0;
                    position: static;
                    width: 26px;
                    height: 22px;
                    background: var(--surface-2);
                    border: 1px solid var(--border);
                    border-radius: 6px;
                }

                html[data-sidebar="rail"] .sidebar-rail-toggle svg {
                    transform: rotate(180deg);
                }

                html[data-sidebar="rail"] .profile-link {
                    justify-content: center;
                }

                /* Tooltip con el label, solo visible en modo rail */
                html[data-sidebar="rail"] .nav-link {
                    position: relative;
                }

                html[data-sidebar="rail"] .nav-link:hover::after {
                    content: attr(data-label);
                    position: absolute;
                    left: calc(100% + 10px);
                    top: 50%;
                    transform: translateY(-50%);
                    background: var(--surface);
                    color: var(--text);
                    border: 1px solid var(--border);
                    padding: 5px 10px;
                    border-radius: 7px;
                    font-size: 12px;
                    font-weight: 500;
                    white-space: nowrap;
                    box-shadow: var(--shadow-soft);
                    z-index: 200;
                    pointer-events: none;
                }
            }

            /* Auto-colapso por espacio limitado (sin preferencia manual guardada) */
            @media (min-width: 1101px) and (max-width: 1400px) {
                html:not([data-sidebar]) .app-shell {
                    grid-template-columns: 64px minmax(0, 1fr);
                }

                html:not([data-sidebar]) #main-sidebar {
                    padding-left: 8px;
                    padding-right: 8px;
                }

                html:not([data-sidebar]) .brand-text,
                html:not([data-sidebar]) .nav-label,
                html:not([data-sidebar]) .nav-badge,
                html:not([data-sidebar]) .profile-text,
                html:not([data-sidebar]) .nav-section {
                    display: none;
                }

                html:not([data-sidebar]) .nav-section {
                    display: block;
                    height: 1px;
                    margin: 10px 4px;
                    padding: 0;
                    background: var(--border);
                    opacity: 1;
                    overflow: hidden;
                    font-size: 0;
                    white-space: nowrap;
                }

                html:not([data-sidebar]) .sidebar .nav-link,
                html:not([data-sidebar]) .app-shell .nav-link {
                    justify-content: center;
                }

                html:not([data-sidebar]) .brand {
                    justify-content: center;
                }

                html:not([data-sidebar]) .sidebar-rail-toggle {
                    margin-left: 0;
                    position: absolute;
                    right: -10px;
                    top: 18px;
                    background: var(--surface);
                    border: 1px solid var(--border);
                    width: 20px;
                    height: 20px;
                    border-radius: 50%;
                }

                html:not([data-sidebar]) .sidebar-rail-toggle svg {
                    transform: rotate(180deg);
                }

                html:not([data-sidebar]) .profile-link {
                    justify-content: center;
                }

                html:not([data-sidebar]) .nav-link {
                    position: relative;
                }

                html:not([data-sidebar]) .nav-link:hover::after {
                    content: attr(data-label);
                    position: absolute;
                    left: calc(100% + 10px);
                    top: 50%;
                    transform: translateY(-50%);
                    background: var(--surface);
                    color: var(--text);
                    border: 1px solid var(--border);
                    padding: 5px 10px;
                    border-radius: 7px;
                    font-size: 12px;
                    font-weight: 500;
                    white-space: nowrap;
                    box-shadow: var(--shadow-soft);
                    z-index: 200;
                    pointer-events: none;
                }
            }

            @media (max-width: 1100px) {
                .sidebar-rail-toggle {
                    display: none;
                }
            }

            @media (max-width: 768px) {
                .sidebar-toggle-btn {
                    display: flex;
                }

                #main-sidebar {
                    position: fixed !important;
                    top: 0;
                    left: 0;
                    height: 100%;
                    z-index: 100;
                    transform: translateX(-100%);
                    transition: transform .25s cubic-bezier(.4, 0, .2, 1);
                    overflow-y: auto;
                }

                #main-sidebar.is-open {
                    transform: translateX(0);
                }

                body.sidebar-open {
                    overflow: hidden;
                }

                .app-shell {
                    display: block !important;
                }

                .main {
                    margin-left: 0 !important;
                    padding-top: 56px !important;
                }
            }
        </style>

        <script>
            /* ── Preferencia de sidebar (rail/expandido) — se aplica lo antes posible
               para evitar parpadeo antes del resto del layout ── */
            (function () {
                var saved = localStorage.getItem('ui-sidebar');
                if (saved === 'rail' || saved === 'expanded') {
                    document.documentElement.setAttribute('data-sidebar', saved);
                }
            })();

            (function () {

                /* ── Rail toggle (colapsar/expandir sidebar, desktop) ────── */
                var railToggle = document.getElementById('sidebar-rail-toggle');
                var railQuery = window.matchMedia('(min-width: 1101px) and (max-width: 1400px)');

                function isRailNow() {
                    var pref = document.documentElement.getAttribute('data-sidebar');
                    if (pref === 'rail') return true;
                    if (pref === 'expanded') return false;
                    return railQuery.matches;
                }

                function syncRailToggleLabel() {
                    if (!railToggle) return;
                    var label = isRailNow() ? 'Expandir navegación' : 'Colapsar navegación';
                    railToggle.setAttribute('aria-label', label);
                    railToggle.setAttribute('title', label);
                }

                railToggle?.addEventListener('click', function () {
                    var next = isRailNow() ? 'expanded' : 'rail';
                    document.documentElement.setAttribute('data-sidebar', next);
                    localStorage.setItem('ui-sidebar', next);
                    syncRailToggleLabel();
                });

                syncRailToggleLabel();
                railQuery.addEventListener('change', syncRailToggleLabel);

                /* ── Sidebar toggle (móvil) ──────────────────────── */
                var toggle = document.getElementById('sidebar-toggle');
                var sidebar = document.getElementById('main-sidebar');
                var overlay = document.getElementById('sidebar-overlay');

                function openSidebar() { sidebar?.classList.add('is-open'); overlay?.classList.add('is-open'); document.body.classList.add('sidebar-open'); toggle?.setAttribute('aria-expanded', 'true'); }
                function closeSidebar() { sidebar?.classList.remove('is-open'); overlay?.classList.remove('is-open'); document.body.classList.remove('sidebar-open'); toggle?.setAttribute('aria-expanded', 'false'); }

                toggle?.addEventListener('click', function () { sidebar?.classList.contains('is-open') ? closeSidebar() : openSidebar(); });
                overlay?.addEventListener('click', closeSidebar);
                document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSidebar(); });
                sidebar?.querySelectorAll('a.nav-link').forEach(function (l) { l.addEventListener('click', function () { if (window.innerWidth <= 768) closeSidebar(); }); });

                /* ── Logout ─────────────────────────────────────── */
                document.getElementById('btn-nav-logout')?.addEventListener('click', function () {
                    if (window.confirm('¿Cerrar sesión en DevCoast?')) window.location.href = '/logout';
                });

            })();

            /*
             * La bell se inyecta en DOMContentLoaded porque el script del sidebar
             * corre ANTES de que <main> (y por tanto .topbar-actions) exista en el DOM.
             */
            document.addEventListener('DOMContentLoaded', function () {

                var bellHost = document.getElementById('bell-widget-host');
                var bellBtn = document.getElementById('bell-btn');
                var bellDrop = document.getElementById('bell-dropdown');

                if (!bellHost || !bellBtn || !bellDrop) return;

                /* Destino: .topbar-actions en páginas normales,
                   .chat-header-estado como fallback en el chat */
                var target = document.querySelector('.topbar-actions');
                var mode = 'prepend';

                if (!target) {
                    target = document.querySelector('.chat-header');
                    mode = 'append';
                }

                if (!target) return;

                bellHost.style.display = 'inline-flex';
                bellHost.style.alignItems = 'center';
                bellHost.style.position = 'relative';

                if (mode === 'prepend' && target.firstChild) {
                    target.insertBefore(bellHost, target.firstChild);
                } else {
                    target.appendChild(bellHost);
                }

                /* Toggle dropdown */
                bellBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var isOpen = bellDrop.style.display !== 'none';
                    bellDrop.style.display = isOpen ? 'none' : 'block';
                    bellBtn.classList.toggle('is-open', !isOpen);
                });

                /* Cerrar al hacer clic fuera */
                document.addEventListener('click', function (e) {
                    if (!bellHost.contains(e.target)) {
                        bellDrop.style.display = 'none';
                        bellBtn.classList.remove('is-open');
                    }
                });
            });

            /* ── Marcar todas como leídas ──────────────────────── */
            function marcarTodasLeidas(btn) {
                fetch('/notificaciones/leer-todas', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }
                }).then(function (r) { return r.json(); }).then(function (d) {
                    if (d.ok) {
                        document.querySelectorAll('.notif-item--unread').forEach(function (el) { el.classList.remove('notif-item--unread'); });
                        document.querySelectorAll('.notif-item-dot').forEach(function (el) { el.remove(); });
                        document.querySelectorAll('.bell-btn-badge').forEach(function (el) { el.remove(); });
                        document.querySelectorAll('.bell-dropdown-count').forEach(function (el) { el.remove(); });
                        document.querySelectorAll('.bell-dropdown-footer').forEach(function (el) { el.remove(); });
                    }
                }).catch(function () { });
            }
        </script>

    </th:block>

</body>

</html>
