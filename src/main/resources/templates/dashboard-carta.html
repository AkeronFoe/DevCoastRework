<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/nautico :: meta}"></th:block>
    <title>Tu travesía | DevCoast</title>
    <th:block th:replace="~{fragments/nautico :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/CSS/nautico-pase.css}">
    <link rel="stylesheet" th:href="@{/CSS/nautico-dashboard.css}">
</head>

<body>
    <a class="skip" href="#contenido">Saltar al contenido</a>

    <div class="app">
        <aside th:replace="~{fragments/nautico :: sidebar('dashboard')}"></aside>
        <div th:replace="~{fragments/nautico :: scrim}"></div>

        <div class="main">
            <header th:replace="~{fragments/nautico :: topbar('/empleos', 'Buscar ofertas', 'Busca por cargo o empresa', null)}"></header>

            <main class="content" id="contenido">
                <div class="head">
                    <div>
                        <div class="eyebrow">// resumen</div>
                        <h1>Dashboard</h1>
                        <p class="sub">Vista previa de la carta de navegación (página temporal).</p>
                    </div>
                </div>

                <div class="sec2"><h2>Tu travesía</h2><span>tus solicitudes, de la salida al puerto</span>
                    <span class="lg" aria-hidden="true"><i class="sw" style="background:#FF7B4F"></i>Programación</span>
                    <span class="lg" aria-hidden="true"><i class="sw" style="background:#2DD4BF"></i>Diseño</span>
                    <span class="lg" aria-hidden="true"><i class="sw" style="background:#CDD1DB"></i>Otras</span>
                    <a th:href="@{/solicitudes}">ver solicitudes</a></div>
                <th:block th:replace="~{fragments/pase :: carta(${carta})}"></th:block>
            </main>
        </div>
    </div>

    <div th:replace="~{fragments/nautico :: toast}"></div>
</body>

</html>
