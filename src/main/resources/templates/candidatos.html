<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/nautico :: meta}"></th:block>
    <title>Postulaciones | DevCoast</title>
    <th:block th:replace="~{fragments/nautico :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/CSS/nautico-pase.css}">
    <link rel="stylesheet" th:href="@{/CSS/nautico-empresa.css}">
    <script th:src="@{/JS/postulaciones-pase.js}" defer></script>
</head>

<body class="empresa">
    <a class="skip" href="#contenido">Saltar al contenido</a>

    <div class="app">
        <aside th:replace="~{fragments/nautico :: sidebar('postulaciones')}"></aside>
        <div th:replace="~{fragments/nautico :: scrim}"></div>

        <div class="main">
            <header
                th:replace="~{fragments/nautico :: topbar('/candidatos', 'Buscar candidatos', 'Busca por nombre o cargo', ${q})}">
            </header>

            <main class="content" id="contenido" th:with="estP=${estadoSel == '' ? null : estadoSel}">
                <p class="flash" role="status" th:if="${flashMessage != null}"
                    th:classappend="${flashType == 'error' or flashType == 'warning'} ? 'error'"
                    th:text="${flashMessage}">Aviso</p>

                <div class="head">
                    <div>
                        <div class="eyebrow">// postulaciones</div>
                        <h1>Postulaciones</h1>
                        <p class="sub" id="conteo" aria-live="polite">
                            <span id="cTotal" th:text="${nTotal}">0</span> <span
                                th:text="${nTotal == 1 ? 'postulación' : 'postulaciones'}">postulaciones</span> ·
                            <span id="cRevision" th:text="${nRevision}">0</span> en revisión ·
                            <span id="cAceptadas" th:text="${nAceptadas}">0</span> <span
                                th:text="${nAceptadas == 1 ? 'aceptada' : 'aceptadas'}">aceptadas</span>
                        </p>
                    </div>
                </div>

                <div class="tabs" role="group" aria-label="Estado de las postulaciones"
                    th:attr="data-estado=${estadoSel}">
                    <a class="ch" th:href="@{/candidatos(q=${q})}"
                        th:attr="aria-current=${estadoSel == ''} ? 'true'">Todas <b id="tTotal"
                            th:text="${nTotal}">0</b></a>
                    <a class="ch" th:href="@{/candidatos(estado='revision',q=${q})}"
                        th:attr="aria-current=${estadoSel == 'revision'} ? 'true'">En revisión <b id="tRevision"
                            th:text="${nRevision}">0</b></a>
                    <a class="ch" th:href="@{/candidatos(estado='aceptadas',q=${q})}"
                        th:attr="aria-current=${estadoSel == 'aceptadas'} ? 'true'">Aceptadas <b id="tAceptadas"
                            th:text="${nAceptadas}">0</b></a>
                    <a class="ch" th:href="@{/candidatos(estado='rechazadas',q=${q})}"
                        th:attr="aria-current=${estadoSel == 'rechazadas'} ? 'true'">No avanzaron <b id="tNoAvanzaron"
                            th:text="${nNoAvanzaron}">0</b></a>
                    <a class="clear" th:if="${hayFiltros}" th:href="@{/candidatos}">limpiar filtros</a>
                </div>

                <section class="ofg" th:each="g : ${grupos}"
                    th:attr="aria-labelledby='of-' + ${g.id},data-oferta=${g.id},data-activa=${g.activa},data-rev=${g.revision},data-ace=${g.aceptadas},data-no=${g.noAvanzaron}">
                    <header class="ofg-h">
                        <div class="ofg-t">
                            <span class="area" th:classappend="${g.areaClave}">
                                <svg th:if="${g.areaClave == 'p'}" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" />
                                </svg>
                                <svg th:if="${g.areaClave == 'd'}" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M3 21l3.5-.8L19 7.7 16.3 5 3.8 17.5z" />
                                    <path d="M14.5 6.8l2.7 2.7" />
                                </svg>
                                <svg th:if="${g.areaClave == 'o'}" viewBox="0 0 24 24" aria-hidden="true">
                                    <rect x="3" y="7" width="18" height="13" rx="2" />
                                    <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
                                </svg>
                                <span th:text="${g.categoria != null} ? ${g.categoria} : 'Oferta'">Programación</span>
                            </span>
                            <h2 th:id="'of-' + ${g.id}"><a th:href="@{/empleos/{id}/postulaciones(id=${g.id})}"
                                    th:text="${g.titulo}">Backend Java</a></h2>
                            <span class="cerrada" th:unless="${g.activa}">CERRADA</span>
                        </div>
                        <p class="ofg-c"
                            th:text="${g.revision} + ' en revisión · ' + ${g.aceptadas} + (${g.aceptadas} == 1 ? ' aceptada' : ' aceptadas') + ' · ' + ${g.noAvanzaron} + (${g.noAvanzaron} == 1 ? ' no avanzó' : ' no avanzaron')">
                            2 en revisión · 1 aceptada</p>
                    </header>
                    <div class="reqs">
                        <th:block th:each="v, st : ${g.items}">
                            <th:block th:replace="~{fragments/pase :: candidato(${v}, ${st.index})}"></th:block>
                        </th:block>
                    </div>
                </section>

                <nav class="pager" aria-label="Páginas de postulaciones" th:if="${totalPaginas > 1}">
                    <a th:if="${pagina > 0}" th:href="@{/candidatos(estado=${estP},q=${q},page=${pagina - 1})}"
                        rel="prev">← Anterior</a>
                    <span th:text="|Página ${pagina + 1} de ${totalPaginas}|">Página 1 de 2</span>
                    <a th:if="${pagina < totalPaginas - 1}"
                        th:href="@{/candidatos(estado=${estP},q=${q},page=${pagina + 1})}" rel="next">Siguiente →</a>
                </nav>

                <th:block th:if="${#lists.isEmpty(grupos) and nTotal == 0}">
                    <div
                        th:replace="~{fragments/nautico :: empty('Mar en calma.', 'Todavía nadie se ha postulado. Cuando lleguen postulaciones a tus ofertas aparecerán aquí.', '/misEmpleos', 'Ver mis ofertas')}">
                    </div>
                </th:block>
                <th:block th:if="${#lists.isEmpty(grupos) and nTotal > 0}">
                    <div
                        th:replace="~{fragments/nautico :: empty('Mar en calma.', 'No hay postulaciones con esos filtros.', '/candidatos', 'Limpiar filtros')}">
                    </div>
                </th:block>
            </main>
        </div>
    </div>

    <div th:replace="~{fragments/nautico :: toast}"></div>
</body>

</html>
