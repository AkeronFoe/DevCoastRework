<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/nautico :: meta}"></th:block>
    <title>Mensajes | DevCoast</title>
    <th:block th:replace="~{fragments/nautico :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/CSS/nautico-mensajes.css}">
    <script th:src="@{/JS/mensajes.js}" defer></script>
</head>

<body th:classappend="${session.usuarioActualTipo == 'empresa'} ? 'empresa'">
    <a class="skip" href="#contenido">Saltar al contenido</a>

    <div class="app">
        <aside th:replace="~{fragments/nautico :: sidebar('mensajes')}"></aside>
        <div th:replace="~{fragments/nautico :: scrim}"></div>

        <div class="main">
            <header
                th:replace="~{fragments/nautico :: topbar('/mensajes', 'Buscar conversaciones', 'Busca por nombre o cargo', ${q})}">
            </header>

            <main class="mx" id="contenido">
                <th:block th:replace="~{fragments/mensajes :: lista(${conversaciones}, null, ${totalNoLeidos}, ${q})}">
                </th:block>

                <section class="mx-thread mx-idle" aria-label="Ninguna conversación abierta">
                    <div class="mx-idle-box">
                        <svg viewBox="96 270 186 156" role="img" aria-label="La gaviota espera en cubierta">
                            <rect x="264" y="282" width="12" height="150" rx="6" fill="#F3F4F8" />
                            <rect x="96" y="397" width="186" height="40" fill="#F3F4F8" />
                            <rect x="96" y="410" width="186" height="9" fill="#2DD4BF" />
                            <th:block th:replace="~{fragments/nautico :: gull}"></th:block>
                        </svg>
                        <h2>Elige una conversación.</h2>
                        <p>Las charlas con
                            <span
                                th:text="${session.usuarioActualTipo == 'empresa'} ? 'tus candidatos' : 'las empresas'">las
                                empresas</span>
                            viven acá, con lo último arriba.
                        </p>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>

</html>
