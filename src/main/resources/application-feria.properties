# Se aplica solo con DEVCOAST_PERFIL=feria.
# La feria usa SU PROPIA base de datos, aunque MONGODB_URI apunte a la de siempre: así nunca se mezcla con datos reales o de pruebas anteriores.
# Cambia el nombre con FERIA_BASE_DE_DATOS si quieres otra (por ejemplo, una nueva para empezar de cero).
spring.mongodb.database=${FERIA_BASE_DE_DATOS:devcoast_feria}

# El seeder de miles de datos inventados queda apagado en modo feria (aunque SEED_ENABLED=true esté en el .env): la feria muestra solo lo curado.
devcoast.seed.enabled=false
