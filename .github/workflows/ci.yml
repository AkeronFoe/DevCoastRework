name: CI

# esto corre en cada push y cada PR a main, asi nadie mergea algo que no compila o rompe un test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # levantamos un Mongo de mentiritas nada mas para que la app pueda arrancar en los tests
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://localhost:27017/devcoast_ci
      CLOUDINARY_CLOUD_NAME: ci-test
      CLOUDINARY_API_KEY: ci-test
      CLOUDINARY_API_SECRET: ci-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build y tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify
